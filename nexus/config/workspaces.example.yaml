# Nexus Workbench — definiciones de workspace (ejemplo versionable)
#
# Importar con: node nexus/scripts/import-workspaces.mjs (DENTRO de una
# terminal de Nexus Workbench — usa `wsh workspace create`). Idempotente por
# nombre; los ambientes se resuelven contra environments.yaml|.json.
# Campos por bloque: view (term|preview|web), environment, path (preview),
# url (web), y por workspace: id, name, icon, color, tabname.
version: 1

workspaces:
    - id: ops-nexusos
      name: Ops NexusOS
      icon: server
      color: green
      environments: [nexusos]
      layout:
          - view: term
            environment: nexusos
          - view: term
            environment: nexusos
          - view: preview
            path: "~"
            environment: nexusos

    - id: home-lab
      name: Home Lab
      icon: flask
      color: blue
      environments: [raspi-media, rig3060, wsl-ubuntu]
      layout:
          - view: term
            environment: raspi-media
          - view: term
            environment: rig3060
