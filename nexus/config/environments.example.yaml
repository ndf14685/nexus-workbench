# Nexus Workbench — catálogo de ambientes (ejemplo versionable)
#
# Copiá este archivo a `environments.yaml` (gitignored) y ajustalo.
# Importalo a la config de Wave con:
#   node nexus/scripts/import-environments.mjs [--dev] [--dry-run]
#
# REGLAS DE SEGURIDAD:
# - NUNCA credenciales, claves, passphrases ni tokens acá.
# - Los hosts SSH referencian alias de ~/.ssh/config; la autenticación la
#   resuelven ssh-agent / claves del sistema (ver nexus/docs/SECURITY.md).
#
# Campos:
#   id            identificador estable (kebab-case)
#   name          nombre humano
#   kind          local | wsl | ssh
#   host          (ssh) alias de ~/.ssh/config o user@host
#   distro        (wsl) nombre de la distro (wsl -l)
#   class         lab | personal | work | prod   → define tema/color por defecto
#   criticality   low | medium | high            → informativo; high ⇒ confirmar
#   env           (opcional) variables para las terminales de ese ambiente.
#                 El VALOR puede ser literal o una referencia ${secret:NOMBRE}
#                 al almacén cifrado (wsh secret set NOMBRE). La referencia la
#                 resuelve wavesrv al arrancar el proceso: el valor no queda en
#                 este archivo, no pasa por una línea de comando (ps) ni por el
#                 servidor MCP ni por la auditoría. Nombres del almacén:
#                 [A-Za-z][A-Za-z0-9_]*
#   theme         (opcional) override de term:theme de Wave
#   icon          (opcional) icono FontAwesome del widget (default por kind)
#   notes         texto libre
#
# El importador genera además un widget por ambiente en la barra lateral
# (equivalente a la lista de conexiones guardadas de WinSSHterm): click en el
# widget = terminal nueva en esa conexión, coloreado por clase.
version: 1

environments:
    - id: local-windows
      name: Local Windows
      kind: local
      class: personal
      criticality: low
      notes: PowerShell 7 por defecto (term:localshellpath en settings.json si hace falta)

    - id: wsl-ubuntu
      name: WSL Ubuntu
      kind: wsl
      distro: Ubuntu
      class: personal
      criticality: low

    - id: nexusos
      name: NexusOS
      kind: ssh
      host: nexusos
      class: lab
      criticality: medium
      notes: alias definido en ~/.ssh/config

    - id: raspi-media
      name: Raspberry Media Center
      kind: ssh
      host: raspi-media
      class: personal
      criticality: low

    - id: rig3060
      name: rig3060
      kind: ssh
      host: rig3060
      class: lab
      criticality: medium

    - id: work-example
      name: Trabajo (ejemplo)
      kind: ssh
      host: work-bastion
      class: work
      criticality: high
      notes: sin credenciales; acceso vía bastion definido en ~/.ssh/config
      # las terminales de este ambiente arrancan con el perfil y el cluster
      # correctos, sin exportar nada a mano y sin que el valor viva acá
      env:
          AWS_REGION: us-east-1
          AWS_PROFILE: ${secret:WORK_AWS_PROFILE}
          KUBECONFIG: ${secret:WORK_KUBECONFIG_PATH}

# Agentes de IA por suscripción: cada uno es un botón de la barra lateral que
# lanza el CLI en un bloque terminal. El login OAuth (Claude Pro/Max, Codex)
# lo maneja el CLI mismo — acá no va ninguna credencial.
# Campos: id, name, command (obligatorios); icon, color, environment (opcional,
# id de un ambiente ssh/wsl para correr el CLI en ese host) y fallbacks: la
# cadena de reemplazo. Si el CLI arranca diciendo que se agotó la cuota o que no
# está disponible, launch_agent cae al siguiente y avisa cuál quedó corriendo.
# Sin fallbacks, quedarse sin cuota corta el trabajo a la mitad.
agents:
    - id: claude
      name: Claude Code
      command: claude
      icon: robot
      fallbacks: [codex, ollama-local]

    - id: codex
      name: Codex
      command: codex
      icon: microchip
      fallbacks: [claude, ollama-local]

    - id: ollama-local
      name: Ollama local
      command: ollama run qwen2.5-coder
      icon: server
      environment: rig3060
