# Nexus Workbench — catálogo de ambientes (ejemplo versionable)
#
# Copiá este archivo a `environments.yaml` (gitignored) y ajustalo.
# Importalo a la config de Wave con:
#   node nexus/scripts/import-environments.mjs [--dev] [--dry-run]
#
# REGLAS DE SEGURIDAD:
# - NUNCA credenciales, claves, passphrases ni tokens acá. El importador aborta
#   si los detecta.
# - `identityfile` es una RUTA a la clave (no la clave): eso sí es válido.
# - Para SSH con contraseña, guardala en el secret store cifrado
#   (`wsh secret set MI_PASS`) y referenciala con `ssh:passwordsecretname` en
#   connections.json. Así no hay ni un prompt ni una credencial en disco claro.
#
# Campos:
#   id            identificador estable (kebab-case)
#   name          nombre humano
#   kind          local | wsl | ssh
#   host          (ssh, OBLIGATORIO) alias de ~/.ssh/config, o user@host[:port]
#   user          (ssh, opcional) usuario de login — ver AVISO de abajo
#   port          (ssh, opcional) puerto; 22 se omite del nombre canónico
#   identityfile  (ssh, opcional) ruta (o lista de rutas) a la clave privada
#   wsh           (ssh, opcional) true = integración wsh (default);
#                 false = shell remota pelada, estilo WinSSHterm
#   distro        (wsl, OBLIGATORIO) nombre de la distro (`wsl -l`)
#   class         lab | personal | work | prod   → define tema/color por defecto
#   criticality   low | medium | high            → informativo; high ⇒ confirmar
#   theme         (opcional) override de term:theme de Wave
#   icon          (opcional) icono FontAwesome del widget (default por kind)
#   notes         texto libre
#
# AVISO SOBRE `user`: si no lo ponés y ~/.ssh/config no define `User` para ese
# host, Wave cae a `user.Current()`. En Windows eso es "MAQUINA\usuario", que se
# manda tal cual como login SSH y la autenticación falla sin explicar por qué.
# En Windows, poné `user:` explícito.
#
# `wsh: true` (default) instala un helper en el servidor y habilita el bloque
# gráfico completo (archivos, edición remota, `wsh` en la terminal remota).
# `wsh: false` es modo WinSSHterm puro: NO instala nada en el servidor y abre una
# shell y nada más — más rápido de arrancar y sin huella, pero sin integración.
# Elegí `false` para equipos chicos/ARM o donde no querés escribir nada.
#
# El orden de la lista define `display:order`: lo primero es lo más prominente.
#
# HOSTS Y USUARIOS DE ABAJO SON PLACEHOLDERS. El catálogo real
# (nexus/config/environments.yaml) está gitignored: no se versiona.
version: 1

environments:
    - id: rig-ubuntu
      name: Rig Ubuntu
      kind: ssh
      host: 192.0.2.10 # PLACEHOLDER: IP o alias de ~/.ssh/config
      user: usuario # PLACEHOLDER
      class: lab
      criticality: medium
      notes: wsh habilitado (default) — integración completa de bloques

    - id: raspberry
      name: Raspberry
      kind: ssh
      host: 192.0.2.20 # PLACEHOLDER: IP o alias de ~/.ssh/config
      user: pi # PLACEHOLDER
      wsh: false # ARM chico: shell pelada estilo WinSSHterm, sin instalar nada
      class: personal
      criticality: low

    - id: local
      name: PC Local
      kind: local
      class: personal
      criticality: low
      notes: shell local (term:localshellpath en settings.json para elegir cuál)

    # Último a propósito: WSL queda con el display:order más alto (menos
    # prominente) porque no es un ambiente de uso diario.
    - id: wsl
      name: WSL
      kind: wsl
      distro: Ubuntu # PLACEHOLDER: salida de `wsl -l`
      class: personal
      criticality: low

# Agentes de IA por suscripción: UN botón por herramienta en la barra lateral,
# que lanza el CLI en un bloque terminal. El login OAuth (Claude Pro/Max, Codex)
# lo maneja el CLI mismo — acá no va ninguna credencial.
# Campos: id, name, command (obligatorios); icon, color, environment (opcional,
# id de un ambiente ssh/wsl para correr el CLI en ese host).
#
# `modes` (opcional): variantes de invocación de la MISMA herramienta. Con 2 o
# más modos el click abre un menú en vez de crear el bloque directo, así no hay
# un botón por variante. `danger: true` marca el modo en el menú con "⚠ ".
# Ver nexus/docs/AI.md.
agents:
    - id: claude
      name: Claude Code
      command: claude
      icon: robot
      modes:
          - id: normal
            label: Claude Code
            command: claude
          - id: full
            label: Claude Code (permisos totales)
            command: claude --dangerously-skip-permissions
            danger: true

    - id: codex
      name: Codex
      command: codex
      icon: microchip
      modes:
          - id: normal
            label: Codex
            command: codex
          - id: full
            label: Codex (permisos totales)
            command: codex --yolo
            danger: true
