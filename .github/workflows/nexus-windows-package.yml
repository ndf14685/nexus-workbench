# Nexus Workbench: genera el instalador Windows.
# Firma si existen los secrets WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD; si no, sale
# sin firmar y con la verificación de update apagada (nexus/docs/SIGNING.md).
# - workflow_dispatch: build suelto, artefactos solo en el run (canal dev/candidate).
# - push de tag beta: publica un prerelease con el instalador + beta.yml para
#   que el auto-update de las instalaciones beta lo pueda resolver.
# - push de tag estable: deja un borrador para promoción manual.
name: Nexus Windows Package

on:
    workflow_dispatch: null
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+*"

env:
    GO_VERSION: "1.26.5"
    NODE_VERSION: 22

permissions:
    contents: write

jobs:
    package-windows:
        name: Package Nexus Workbench (Windows)
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version: ${{env.GO_VERSION}}
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{env.NODE_VERSION}}
                  cache: npm
                  cache-dependency-path: package-lock.json
            - uses: nick-fields/retry@v4
              name: npm ci
              with:
                  command: npm ci --no-audit --no-fund
                  retry_on: error
                  max_attempts: 3
                  timeout_minutes: 5
            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Install Zig
              uses: mlugg/setup-zig@v2
            - name: Package
              run: task package
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: false
                  # Vacíos mientras no existan los secrets: ahí electron-builder
                  # no firma y verifyUpdateCodeSignature queda apagado solo.
                  # Ver nexus/docs/SIGNING.md.
                  WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
                  WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
                  NEXUS_PUBLISHER_NAME: ${{ vars.NEXUS_PUBLISHER_NAME }}
              shell: powershell
            # El contexto secrets no se puede usar en un `if` de step, sólo en `env`.
            - name: Verificar la firma del instalador
              shell: powershell
              env:
                  SIGNING_ENABLED: ${{ secrets.WIN_CSC_LINK != '' }}
                  EXPECTED_PUBLISHER: ${{ vars.NEXUS_PUBLISHER_NAME }}
              run: |
                  if ($env:SIGNING_ENABLED -ne 'true') {
                      Write-Host "sin certificado configurado: instalador sin firmar (ver nexus/docs/SIGNING.md)"
                      exit 0
                  }
                  $exe = Get-ChildItem make\*.exe | Select-Object -First 1
                  $sig = Get-AuthenticodeSignature -LiteralPath $exe.FullName
                  Write-Host "status: $($sig.Status)  subject: $($sig.SignerCertificate.Subject)"
                  # En el runner la raíz autofirmada no está confiada, así que el
                  # status no va a ser Valid; acá se valida que la firma exista y
                  # traiga el subject esperado. La cadena la valida Windows en la
                  # máquina donde el certificado sí está confiado.
                  if ($sig.Status -eq 'NotSigned') { throw "el instalador salio sin firmar" }
                  if ($env:EXPECTED_PUBLISHER -and $sig.SignerCertificate.Subject -notlike "*$($env:EXPECTED_PUBLISHER)*") {
                      throw "el subject firmado no coincide con NEXUS_PUBLISHER_NAME; el updater rechazaria cada actualizacion"
                  }
            - name: Build MCP server
              run: cd nexus/mcp; go build -ldflags="-s -w" -o ../../make/nexus-workbench-mcp.exe .
              env:
                  CGO_ENABLED: "0"
              shell: powershell
            - name: Generate SBOM
              uses: anchore/sbom-action@v0
              with:
                  path: .
                  format: spdx-json
                  artifact-name: nexus-workbench-sbom.spdx.json
                  output-file: make/nexus-workbench-sbom.spdx.json
                  upload-artifact: false
                  upload-release-assets: false
            - name: Checksums de los artefactos
              shell: bash
              run: |
                  cd make
                  sha256sum *.exe *.msi *.zip *.spdx.json > SHA256SUMS.txt
                  cat SHA256SUMS.txt
            - name: Upload installer artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: nexus-workbench-windows
                  path: |
                      make/*.exe
                      make/*.msi
                      make/*.zip
                      make/*.yml
                      make/*.blockmap
                      make/nexus-workbench-mcp.exe
                      make/nexus-workbench-sbom.spdx.json
                      make/SHA256SUMS.txt
                  retention-days: 30
            - name: Create release (beta publicada, estable candidato)
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v2
              with:
                  draft: ${{ !contains(github.ref_name, '-beta.') }}
                  prerelease: ${{ contains(github.ref_name, '-beta.') }}
                  name: >-
                      Nexus Workbench ${{ github.ref_name }}${{ contains(github.ref_name, '-beta.') && ' (beta)' || ' (candidate)' }}
                  files: |
                      make/*.exe
                      make/*.msi
                      make/*.zip
                      make/*.yml
                      make/*.blockmap
                      make/nexus-workbench-mcp.exe
                      make/nexus-workbench-sbom.spdx.json
                      make/SHA256SUMS.txt
                  body: |
                      ${{ contains(github.ref_name, '-beta.') && 'Beta publicada: disponible para auto-update del canal beta.' || 'Candidato sin publicar. Probarlo y publicarlo para promoverlo a stable.' }}

                      ${{ secrets.WIN_CSC_LINK != '' && 'Instalador **firmado**. Windows valida la firma si el certificado está confiado en la máquina (ver `nexus/docs/SIGNING.md`).' || '**Instalador sin firmar** — no hay certificado configurado (ver `nexus/docs/SIGNING.md`).' }}

                      Verificá lo que instalás antes de ejecutarlo:

                      ```powershell
                      # el hash del .exe tiene que coincidir con el de SHA256SUMS.txt
                      Get-FileHash .\NexusWorkbench-win32-x64-*.exe -Algorithm SHA256
                      ```

                      `nexus-workbench-sbom.spdx.json` lista las dependencias incluidas en este build (SPDX).
            - name: Prune old releases (keep newest 4)
              if: startsWith(github.ref, 'refs/tags/v')
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh api "repos/${{ github.repository }}/releases" --paginate \
                    --jq 'sort_by(.created_at) | reverse | .[4:] | .[].id' |
                  while read -r id; do
                    echo "borrando release $id"
                    gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
                  done
