# Nexus Workbench: genera el instalador Windows (sin firma).
# - workflow_dispatch: build suelto, artefactos solo en el run (canal dev/candidate).
# - push de tag vX.Y.Z: además crea una GitHub Release en BORRADOR con el
#   instalador + latest.yml. El "Check for Updates" de la app (electron-updater,
#   provider github) solo ve releases PUBLICADAS: publicar el borrador a mano
#   es la promoción candidate -> stable (ver nexus/docs/UPSTREAM_SYNC.md).
name: Nexus Windows Package

on:
    workflow_dispatch: null
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+*"

env:
    GO_VERSION: "1.25.6"
    NODE_VERSION: 22

permissions:
    contents: write

jobs:
    package-windows:
        name: Package Nexus Workbench (Windows, unsigned)
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version: ${{env.GO_VERSION}}
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{env.NODE_VERSION}}
                  cache: npm
                  cache-dependency-path: package-lock.json
            - uses: nick-fields/retry@v4
              name: npm ci
              with:
                  command: npm ci --no-audit --no-fund
                  retry_on: error
                  max_attempts: 3
                  timeout_minutes: 5
            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Install Zig
              uses: mlugg/setup-zig@v2
            - name: Package
              run: task package
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: false
              shell: powershell
            - name: Build MCP server
              run: cd nexus/mcp; go build -ldflags="-s -w" -o ../../make/nexus-workbench-mcp.exe .
              env:
                  CGO_ENABLED: "0"
              shell: powershell
            - name: Upload installer artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: nexus-workbench-windows
                  path: |
                      make/*.exe
                      make/*.msi
                      make/*.zip
                      make/latest.yml
                      make/nexus-workbench-mcp.exe
                  retention-days: 30
            - name: Create draft release (candidate)
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v2
              with:
                  draft: true
                  name: Nexus Workbench ${{ github.ref_name }} (candidate)
                  files: |
                      make/*.exe
                      make/*.msi
                      make/*.zip
                      make/latest.yml
                      make/nexus-workbench-mcp.exe
                  body: |
                      Candidato sin publicar. Probarlo y, si está OK, publicar esta release
                      para promoverla a **stable**: recién entonces "Check for Updates" la ofrece.
            - name: Prune old releases (keep newest 4)
              if: startsWith(github.ref, 'refs/tags/v')
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh api "repos/${{ github.repository }}/releases" --paginate \
                    --jq 'sort_by(.created_at) | reverse | .[4:] | .[].id' |
                  while read -r id; do
                    echo "borrando release $id"
                    gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
                  done
